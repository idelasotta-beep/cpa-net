<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oferta</title>
<style>
  /* Ultra-liviano: sin frameworks. Mobile-first. */
  :root{--bg:#0f1115;--card:#fff;--ink:#111;--muted:#6b7280;--brand:#16a34a;--brand2:#15803d;--line:#e5e7eb;--err:#dc2626}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#f3f4f6;line-height:1.4}
  img{max-width:100%;height:auto;display:block}
  .wrap{max-width:520px;margin:0 auto;background:#fff}
  .hero img{width:100%}
  .pad{padding:16px}
  h1{font-size:22px;margin:8px 0}
  .price{font-size:26px;font-weight:800;color:var(--brand2)}
  .combos{display:grid;gap:10px;margin:14px 0}
  .combo{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
  .combo.sel{border-color:var(--brand);background:#f0fdf4}
  .combo input{width:20px;height:20px;accent-color:var(--brand)}
  .combo .t{font-weight:700}
  .combo .p{margin-left:auto;font-weight:800;color:var(--brand2)}
  .combo .tag{font-size:11px;background:var(--brand);color:#fff;padding:2px 6px;border-radius:6px;margin-left:6px}
  form{display:grid;gap:12px;margin-top:8px}
  label{font-size:13px;font-weight:600;display:block;margin-bottom:4px}
  input,select,textarea{width:100%;font-size:16px;padding:13px;border:1px solid var(--line);border-radius:10px;background:#fff}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .hp{position:absolute;left:-9999px;top:-9999px;height:0;width:0;opacity:0}
  .cta{font-size:19px;font-weight:800;color:#fff;background:var(--brand);border:none;border-radius:12px;padding:16px;cursor:pointer;width:100%}
  .cta:disabled{opacity:.6}
  .err{color:var(--err);font-size:13px;min-height:16px}
  .thanks{display:none;text-align:center;padding:40px 20px}
  .thanks .big{font-size:48px}
  .muted{color:var(--muted);font-size:12px;text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <!-- HERO: el generador reemplaza esto por las imágenes/creativo de la landing -->
  <div class="hero"><img id="heroImg" alt="" src="https://placehold.co/1040x600?text=Producto"></div>

  <div class="pad" id="checkout">
    <h1 id="prodName">Producto</h1>
    <div class="price" id="priceLbl"></div>

    <!-- Selector de combo (1/2/3) -->
    <div class="combos" id="combos"></div>

    <form id="f" novalidate>
      <div><label for="name">Nombre y apellido</label><input id="name" name="name" autocomplete="name" required></div>
      <div><label for="phone">Teléfono / WhatsApp</label><input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" required></div>
      <div class="row">
        <div><label for="street">Calle</label><input id="street" name="street" autocomplete="address-line1" required></div>
        <div><label for="streetNumber">Número</label><input id="streetNumber" name="streetNumber" inputmode="numeric" required></div>
      </div>
      <div class="row">
        <div><label for="floor">Piso/Depto <span class="muted">(opcional)</span></label><input id="floor" name="floor"></div>
        <div><label for="postalCode">Código postal</label><input id="postalCode" name="postalCode" required></div>
      </div>
      <div><label for="city">Ciudad / Localidad</label><input id="city" name="city" autocomplete="address-level2" required></div>
      <div><label for="provinceId">Provincia</label>
        <select id="provinceId" name="provinceId" required>
          <option value="">Elegí tu provincia…</option>
          <option value="1">Buenos Aires</option><option value="2">CABA</option>
          <option value="3">Catamarca</option><option value="4">Chaco</option>
          <option value="5">Chubut</option><option value="6">Córdoba</option>
          <option value="7">Corrientes</option><option value="8">Entre Ríos</option>
          <option value="9">Formosa</option><option value="10">Jujuy</option>
          <option value="11">La Pampa</option><option value="12">La Rioja</option>
          <option value="13">Mendoza</option><option value="14">Misiones</option>
          <option value="15">Neuquén</option><option value="16">Río Negro</option>
          <option value="17">Salta</option><option value="18">San Juan</option>
          <option value="19">San Luis</option><option value="20">Santa Cruz</option>
          <option value="21">Santa Fe</option><option value="22">Santiago del Estero</option>
          <option value="23">Tierra del Fuego</option><option value="24">Tucumán</option>
        </select>
      </div>
      <div><label for="betweenStreets">Entre calles / referencia <span class="muted">(opcional)</span></label><input id="betweenStreets" name="betweenStreets"></div>

      <!-- Honeypot anti-bot: oculto; un humano lo deja vacío -->
      <input class="hp" tabindex="-1" autocomplete="off" id="hp" name="hp">

      <div class="err" id="err"></div>
      <button class="cta" id="submit" type="submit">Finalizar pedido (pago al recibir)</button>
      <div class="muted">Pagás en efectivo cuando lo recibís. Envío a todo el país.</div>
    </form>
  </div>

  <div class="thanks" id="thanks">
    <div class="big">✅</div>
    <h1>¡Pedido confirmado!</h1>
    <p>Te vamos a llamar para coordinar la entrega. Pagás al recibir.</p>
  </div>
</div>

<script>
/* ===================== CONFIG (el generador rellena esto) ===================== */
var CONFIG = {
  intakeUrl: "https://cpa-net.teleservespa.com/api/intake",
  pixelId: "",                     // ID del pixel de Meta ("" = sin pixel)
  sku: "SKU-P90",
  productName: "Linterna Táctica TY-908",
  heroImage: "",                   // URL de la imagen del hero ("" = placeholder)
  currency: "$",
  combos: [                        // qty + precio TOTAL del combo (debe matchear catálogo de la red)
    { qty: 1, price: 57982, label: "1 unidad" },
    { qty: 2, price: 98569, label: "2 unidades", tag: "MÁS VENDIDO" },
    { qty: 3, price: 115964, label: "3 unidades", tag: "MEJOR PRECIO" }
  ],
  defaultCombo: 1                  // índice del combo preseleccionado
};
/* ============================================================================= */

(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };

  // --- Config visual ---
  if (CONFIG.heroImage) $("heroImg").src = CONFIG.heroImage;
  $("prodName").textContent = CONFIG.productName;
  var money = function(n){ return CONFIG.currency + Number(n).toLocaleString("es-AR"); };

  // --- Meta Pixel (opcional) ---
  if (CONFIG.pixelId) {
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version="2.0";n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,"script","https://connect.facebook.net/en_US/fbevents.js");
    window.fbq("init", CONFIG.pixelId);
    window.fbq("track", "PageView");
  }

  // --- Captura de tracking de Meta ---
  function cookie(name){ var m=document.cookie.match("(^|; )"+name+"=([^;]*)"); return m?decodeURIComponent(m[2]):""; }
  var qs = new URLSearchParams(location.search);
  var fbclid = qs.get("fbclid") || "";
  var fbp = cookie("_fbp");
  var fbc = cookie("_fbc");
  if (!fbc && fbclid) fbc = "fb.1." + Date.now() + "." + fbclid;

  // submitId estable por sesión (idempotencia + anti doble-envío)
  var submitId = (crypto.randomUUID ? crypto.randomUUID() :
    "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,function(c){var r=Math.random()*16|0;return (c=="x"?r:(r&0x3|0x8)).toString(16);}));

  // --- Selector de combo ---
  var selected = CONFIG.combos[CONFIG.defaultCombo] || CONFIG.combos[0];
  var cont = $("combos");
  CONFIG.combos.forEach(function(c, i){
    var el = document.createElement("label");
    el.className = "combo" + (c === selected ? " sel" : "");
    el.innerHTML =
      '<input type="radio" name="combo" value="'+i+'"'+(c===selected?" checked":"")+'>' +
      '<span class="t">'+c.label+(c.tag?'<span class="tag">'+c.tag+'</span>':'')+'</span>' +
      '<span class="p">'+money(c.price)+'</span>';
    el.addEventListener("click", function(){ selectCombo(i); });
    cont.appendChild(el);
  });
  function selectCombo(i){
    selected = CONFIG.combos[i];
    [].forEach.call(cont.children, function(ch, idx){ ch.classList.toggle("sel", idx===i); ch.querySelector("input").checked = idx===i; });
    $("priceLbl").textContent = money(selected.price);
  }
  $("priceLbl").textContent = money(selected.price);

  // --- Submit ---
  var form = $("f"), btn = $("submit"), errBox = $("err"), sending = false;

  function fail(msg){ errBox.textContent = msg; btn.disabled = false; sending = false; }

  form.addEventListener("submit", async function(ev){
    ev.preventDefault();
    if (sending) return;
    errBox.textContent = "";

    var v = function(id){ return ($(id).value || "").trim(); };
    // Validación mínima (rápida; el server valida en serio).
    if (!v("name") || v("name").length < 3) return fail("Ingresá tu nombre completo.");
    if ((v("phone").replace(/\D/g,"")).length < 8) return fail("Ingresá un teléfono válido.");
    if (!v("street") || !v("streetNumber")) return fail("Completá calle y número.");
    if (!v("city")) return fail("Ingresá tu ciudad.");
    if (!v("postalCode")) return fail("Ingresá tu código postal.");
    if (!v("provinceId")) return fail("Elegí tu provincia.");

    sending = true; btn.disabled = true; btn.textContent = "Enviando…";

    var payload = {
      submitId: submitId,
      sku: CONFIG.sku,
      quantity: selected.qty,
      totalPriceLocal: selected.price,
      name: v("name"), phone: v("phone"),
      street: v("street"), streetNumber: v("streetNumber"),
      floor: v("floor"), betweenStreets: v("betweenStreets"),
      city: v("city"), postalCode: v("postalCode"),
      provinceId: Number(v("provinceId")),
      fbclid: fbclid, fbp: fbp, fbc: fbc,
      utmSource: qs.get("utm_source") || undefined,
      utmCampaign: qs.get("utm_campaign") || undefined,
      utmContent: qs.get("utm_content") || undefined,
      utmTerm: qs.get("utm_term") || undefined,
      hp: v("hp")
    };

    // Pixel: evento de intención (el server dispara Purchase en la aprobación).
    if (CONFIG.pixelId && window.fbq) {
      try { window.fbq("track", "Lead", { value: selected.price, currency: "ARS" }, { eventID: submitId }); } catch(e){}
    }

    // Submit con 1 reintento ante fallo de red.
    async function post(){
      var r = await fetch(CONFIG.intakeUrl, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
      });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }
    try {
      var data;
      try { data = await post(); }
      catch(e){ await new Promise(function(r){setTimeout(r,1200);}); data = await post(); }
      if (data && data.ok) {
        $("checkout").style.display = "none";
        $("thanks").style.display = "block";
        window.scrollTo(0,0);
      } else {
        fail("No pudimos procesar tu pedido. Revisá los datos e intentá de nuevo.");
      }
    } catch(e){
      fail("Hubo un problema de conexión. Intentá de nuevo en unos segundos.");
      btn.textContent = "Finalizar pedido (pago al recibir)";
    }
  });
})();
</script>
</body>
</html>
